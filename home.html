<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home- GameZone</title>

 <style>
     body{
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: white;
    }

     header{

        background-color: #1e1e1e;
        padding: 20px;
        text-align: center;
        border-bottom: 3px solid #00ff99;
    }
     header h1{
        color:#00ff99 ;

    }
     nav{
        text-align: center;
        padding: 15px;
    }
     nav a {
        color:  white;
        text-decoration: none;
        margin: 15px;
        font-weight: bold;
    }
     nav a:hover{
        color: #00ff99;
    }
     .banner{
        text-align: center;
        padding: 40px;

    }
     .banner h2{
        color: #00ff99;
    }
     .jogos{
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        padding: 20px;
    }

     .card{
        background-color: #1e1e1e;
        width: 250px;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }
     
     .card img{
        width: 250px;
        height: 200px;
        border-radius: 10px;
    }
     
     .card h3{
        color: #00ff99;
    }
     
    footer{
        text-align: center;
        padding: 20px;
        margin-top: 30px;
        background-color: #1e1e1e;
    }


 </style>


 </head>


 <body>
    <header>
        <h1> 🎮 GameZone</h1>
    </header>

     <nav>
        <a href="#">Início</a>
        <a href="#">Jogos</a>
        <a href="#">Ranking</a>
        <a href="#">Sair</a>
    </nav>
        <section class="banner"> 
            <h2>Bem-vindo à Plataforma! </h2>
            <p> Descubra novos jogos e divirta-se com seus amigos.</p>

    </section>


    <section class="jogos">

        <div class="card">
            <img src="img/1.jpg" alt="Jogo de Corrida">
            <h3>Corrida Extrema</h3>
            <p>Dispute corridas emocionantes</p>

        </div>

         <div class="card">
            <img src="img/img.webp" alt="Jogo Espacial">
            <h3>Batalha Espacial</h3>
            <p>Defenda a galáxia dos invasores</p>

        </div>


         <div class="card">
            <img src="img/2.jpg" alt="Jogo de Fantasia">
            <h3>Reino mágico</h3>
            <p>Explore um mundo cheio de aventuras</p>

        </div>

    </section>

    <footer>
         &copy; GameZone 2026 
    </footer>


 </body>
 </html>
